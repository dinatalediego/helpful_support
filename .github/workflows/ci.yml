name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m helpful_support.cli doctor
      - run: python -m helpful_support.cli index
      - run: python -m helpful_support.cli search "webhooks idempotencia"
      - run: python -m unittest discover -s tests -v
